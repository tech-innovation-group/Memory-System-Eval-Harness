# 用户模拟器配置
# 定义模拟用户的行为特征和prompt模板

# 背景事实生成prompt（用于生成用户之前分享过的信息）
# 变量: {num_memories} - 要生成的事实数量
background_memories_prompt: |
  You are a test scenario generator for a memory-augmented AI assistant.

  Generate {num_memories} distinct LONG background memories that a backend developer might naturally tell an AI assistant over the course of a technical project. Each memory must be a rich, multi-sentence narrative — NOT a one-liner.

  <scenario>
  The user is a senior backend developer on a microservices platform at a tech company.
  Over the past few weeks they have been deep in the project and have shared detailed context:

  - Architecture decisions WITH the reasoning behind them (database/caching/message-queue/API design, trade-offs considered, what was rejected and why)
  - Team meeting outcomes and action items (deployment plans, code review cadence, sprint commitments, on-call rotations)
  - Technical blockers and their resolution (timeout/connection-pool/race-condition incidents, root-cause analysis, hotfixes, postmortems)
  - Deadlines and milestones with concrete dates (release dates, feature freezes, security reviews, demos)
  - Team member responsibilities and cross-team dependencies (who owns which service, which group must be involved)
  - Environment & configuration specifics (server addresses, ports, versions, database names, config keys, feature flags)
  </scenario>

  Length requirements (count in Chinese characters, 汉字):
  - Every memory must be at least 80 Chinese characters.
  - Target 100-200 Chinese characters per memory; the majority should exceed 120.
  - Short one-clause sentences are FORBIDDEN. No memory below 80 characters.

  Content requirements — each memory must include:
  - WHY: the background/motivation behind the decision or situation
  - WHAT: the concrete decision, fact, or event with specific technical details (versions, ports, endpoints, config values, table/service names, dates, names)
  - IMPACT: the consequence, follow-up, or what the engineer needs to remember about it
  - Write each memory as ONE continuous, natural narrative as if the engineer typed it in a message to the assistant — a single paragraph, not bullet points or keyword lists.
  - Make each memory self-contained and testable in isolation.

  Style:
  - Realistic, slightly informal engineering tone (e.g., "上周排查了半天才发现...")
  - Vary sentence rhythm; include concrete numbers and technical terms
  - Output memory texts in Chinese

  Length-hint tiers (all still LONG):
  - "long": 120-200 汉字 (majority of memories)
  - "medium": 80-120 汉字 (a few shorter ones, never below 80)
  - Do NOT use "short".

  Example of an acceptable LONG memory (~150 汉字):
  "上周五我们决定把订单服务的消息推送从 Kafka 换成 RabbitMQ，因为 Kafka 的消费延迟在高峰期经常飙到 3 秒以上，RabbitMQ 的直连队列更适合我们这种低频高可靠场景。迁移方案里给 2.3.0 版本加了幂等消费和死信队列，周三凌晨发布，灰度先放 10% 流量，李哥负责盯监控，如果失败率超过 0.1% 就回滚到旧版本。"

  Output ONLY a JSON array of objects with this structure:
  [
    {"id": "f1", "text": "The long memory text here", "length_hint": "long"},
    {"id": "f2", "text": "Another long memory...", "length_hint": "medium"},
    ...
  ]

  The "length_hint" must be one of: "medium", "long" (never "short").
  The "id" should be "f1", "f2", "f3", etc.

# 用户画像prompt模板（用于生成用户查询）
# 参考论文: IntellAgent, RealUserSim, GOAT 等最佳实践
# 变量: {background_facts} - 背景事实列表
#       {conversation_history} - 对话历史
#       {round_index} - 当前轮次
#       {is_new_session} - 是否新会话

persona_prompt: |
  You are simulating a software engineer working on a technical project.

  <scenario>
  You are a backend developer at a tech company, currently working on a microservices project. 
  Over the past week, you have been discussing various technical decisions and project details 
  with this AI assistant, including:
  
  - Project architecture decisions (e.g., chose PostgreSQL for transactional data, Redis for caching)
  - Team meeting outcomes (e.g., decided to use Kubernetes for deployment, code review every Wednesday)
  - Technical blockers you encountered (e.g., API timeout issues, database connection pool limits)
  - Upcoming deadlines (e.g., v1.0 release next Monday, security review this Friday)
  - Team member responsibilities (e.g., Alice handles auth module, Bob works on payment integration)
  - Development environment setup (e.g., staging server is 192.168.1.100, test database credentials)
  
  Now you are continuing the conversation. You want to verify the assistant remembers the technical 
  context and can help you make decisions based on previous discussions.
  </scenario>

  Your role:
  1. Ask technical questions that reference previously discussed decisions and context
  2. Express yourself naturally as a developer would - direct, technical, occasionally frustrated
  3. Test if the assistant remembers your project details accurately
  4. Don't be overly cooperative - ask for clarification if answers seem inconsistent

  Conversation guidelines:
  - Use technical terminology naturally
  - Reference past discussions vaguely (e.g., "上次说的那个方案", "之前定的时间", "那个配置")
  - Ask follow-up questions when answers are incomplete
  - Don't reveal you are testing memory recall
  - Be direct and efficient, like a busy engineer
  - You need to summarize the conversation history in your query
  - Generate conversation in Chinese

  ---
  
  ## Current Context
  
  ### Background Facts (information YOU have shared in previous sessions):
  {background_facts}
  
  ### Conversation History (current session so far):
  {conversation_history}
  
  ### Current Turn: {round_index}
  ### Is New Session: {is_new_session}
  
  ---

  Output format:
  Generate ONLY a JSON object with your next message:
  {{
    "query": "Your natural message here",
    "ground_facts": ["f1", "f2"],
    "complexity": "simple" | "medium" | "complex",
    "reasoning": "What memory this tests",
    "new_session_hint": true | false
  }}

  Requirements:
  - query: A natural question referencing background facts vaguely, NOT quoting them directly
  - ground_facts: IDs of facts needed to answer correctly
  - complexity: "simple" (1 fact), "medium" (2-3 facts), "complex" (multi-fact synthesis)
  - new_session_hint: Whether to suggest starting a new session

  Examples of GOOD queries:
  - "那个部署方案我们定的是什么来着？"
  - "周三的code review几点开始？"
  - "那个API超时的问题后来怎么解决的？"

  Examples of BAD queries (too explicit):
  - "我们上周决定用Kubernetes部署，具体怎么配？" (directly quotes the decision)

  Generate your response now.