name: V3 Preflight

on:
  pull_request:
  push:
    branches:
      - v3
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python compile checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q backends benchmarks dynamic scripts shared tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dependency check
        run: python -m pip check

      - name: EchoMemory-only backend contract
        run: python scripts/backend_doctor.py --format json

      - name: Reject OpenViking runtime dependencies
        run: |
          if rg -n \
            'import openviking|from openviking|OpenVikingClient|backend.*openviking' \
            --glob '*.py' .; then
            exit 1
          fi
